<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>BudgetGo · Spending, sorted</title>
  <link rel="stylesheet" href="animation.css">
  <script src="animation.js" defer></script>
</head>
<body>
  <main>
    <p class="brand">BudgetGo</p>
    <h1>Spending, sorted.</h1>
    <div class="scene">
      <img id="scene" src="../../../src/images/animations/budgetgo-sorter/frame-05-clear.png" width="650" height="540" alt="A lime-green creature pushes a trolley of neatly organized spending categories beside a purple BudgetGo machine.">
    </div>
    <div class="controls" aria-label="Animation controls" hidden>
      <button id="play" type="button">Play</button>
      <div class="frames" aria-label="Choose a frame">
        <button type="button" data-frame="0" aria-pressed="false">Push</button>
        <button type="button" data-frame="1" aria-pressed="false">Load</button>
        <button type="button" data-frame="2" aria-pressed="false">Sort</button>
        <button type="button" data-frame="3" aria-pressed="false">Reveal</button>
        <button type="button" data-frame="4" aria-pressed="true">Clear</button>
      </div>
    </div>
    <a class="download" href="budgetgo-sorter.zip" download>Download animation and five frames</a>
  </main>
</body>
</html>
